name: Release

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release-zip:
    name: Build release zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        run: python scripts/check_versions.py "${GITHUB_REF_NAME}"

      - name: Create zip
        run: |
          cd custom_components/gui_recorder
          zip -r "${{ github.workspace }}/gui_recorder.zip" .

      - name: Upload zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: gui_recorder.zip
