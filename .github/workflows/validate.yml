name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Unit and frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile Python sources
        run: python -m compileall -q custom_components/gui_recorder
      - name: Check version consistency
        run: python scripts/check_versions.py
      - name: Run Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Check and test panel JavaScript
        run: |
          node --check custom_components/gui_recorder/frontend/gui-recorder-panel.js
          node tests/frontend.test.js
      - name: Validate JSON files
        run: |
          for file in custom_components/gui_recorder/manifest.json custom_components/gui_recorder/strings.json custom_components/gui_recorder/translations/*.json hacs.json; do
            python -m json.tool "$file" >/dev/null
          done

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
